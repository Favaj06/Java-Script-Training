<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!--
    The viewport meta tag makes the webpage scale correctly on mobile devices.
    Without it, browsers render the page at a larger virtual width, making text
    and elements appear very small. With it, the page matches the device width,
    making responsive layouts work as intended.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive Design</title>

    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

    <h1>Responsive Design</h1>

    <p>
        Open DevTools and toggle the device toolbar
        (Ctrl+Shift+M / Cmd+Shift+M)
        to simulate mobile.
    </p>

    <hr>

    <!-- ========================= -->
    <!-- Task 4.2 -->
    <!-- ========================= -->

    <div class="responsive-box">

        <h2>Resize the Window</h2>

        <p>
            This box changes style at different screen sizes.
        </p>

    </div>

    <hr>

    <!-- ========================= -->
    <!-- Task 4.3 -->
    <!-- ========================= -->

    <nav class="resp-nav">

        <div class="resp-logo">
            Logo
        </div>

        <ul class="resp-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Products</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

    <hr>

    <!-- ========================= -->
    <!-- Task 4.4 -->
    <!-- ========================= -->

    <section class="image-section">

        <img
            src="https://picsum.photos/800/400"
            alt="Sample landscape">

    </section>

</body>
</html>
