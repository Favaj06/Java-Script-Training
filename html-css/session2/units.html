<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>
    <link rel="stylesheet" href="css/units.css">
</head>
<body>

    <h1>CSS Units Demonstration</h1>

    <!-- Task 1.1 -->
    <div class="box-px">Fixed: 300px wide</div>

    <div class="box-percent">Flexible: 50% wide</div>

    <div class="box-rem">Font-based: 20rem wide</div>

    <div class="box-vw">Viewport: 60vw wide</div>

    <hr>

    <!-- Task 1.2 -->
    <section class="font-demo">

        <p class="px-text">
            This text is 16px
        </p>

        <p class="rem-text">
            This text is 1rem
        </p>

        <p class="em-text">
            This text is 1.5em inside a smaller parent
        </p>

    </section>

</body>
</html>
